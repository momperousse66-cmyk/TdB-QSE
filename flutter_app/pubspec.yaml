name: qse_dashboard
description: Tableau de bord QSE modifiable et réplicable par ville (basé sur Lille_TDB QSE.xlsm).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  fl_chart: ^0.68.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.6
  excel: ^4.0.6
  file_picker: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
